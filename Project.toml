# Serd is a LOCAL fork, deliberately unpublished. Jayhawk uses API that exists only on the
# `jayhawk-1` branch of ~/dev/Serd.jl -- `prefixforpfx`, `prefixforuri`, `prefixes()`, the
# 1-arg `add_prefix!(::Prefix)`, `add_prefix!` warning instead of erroring on redefinition,
# and `read_rdf_file`/`read_rdf_string` returning (statements, prefixes, baseuri) rather than
# just statements. Registry Serd 0.3.x has none of it, so without this stanza any project
# that depends on Jayhawk resolves the registry copy and dies at precompile with
# `UndefVarError: prefixforpfx not defined in Jayhawk` (src/rdf.jl:179).
#
# The path is ABSOLUTE on purpose. A relative "../Serd.jl" resolves against wherever Jayhawk
# itself sits, which is right in ~/dev/Jayhawk and wrong in ~/.julia/packages/Jayhawk/XXXX --
# i.e. it breaks in exactly the case this stanza exists to fix.
#
# Pkg honours a dependency's [sources] transitively: a downstream project that adds or devs
# Jayhawk picks this up without repeating it. Verified, not assumed.
[sources]
Serd = {path = "/Users/doug/dev/Serd.jl"}

[compat]
AutoHashEquals = "0.2"
EzXML = "1"
HTTP = "1"
JSON = "0.21, 1"
Serd = "0.3.2"
URIs = "1"
julia = "1.10"

