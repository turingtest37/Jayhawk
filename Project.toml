# No Serd, and that is the point of the 0.4 split. Everything that parsed RDF into live
# Julia types -- analyze/generate/install!, TraceLog, expand_uris, makeqname, the global
# prefix registry -- moved to RdfMaterializer, which is now the only package that needs the
# private `jayhawk-1` fork of Serd. Consumers of Jayhawk resolve entirely from the General
# registry: no [sources] stanza, no unsatisfiable Serd constraint, no fork to pin.
